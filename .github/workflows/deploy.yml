name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build → Deploy → Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit 2>/dev/null || echo "⚠️ Type errors (non-blocking)"

      - name: Build
        run: pnpm build

      # Railway auto-deploys from GitHub push — poll /api/health until commit SHA
      # in the response matches THIS commit's SHA, proving the new build is live.
      # (Old logic only checked HTTP 200, which passes during builds because the
      # previous deploy keeps serving until the new one cuts over.)
      - name: Verify production health
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          DEADLINE=$((SECONDS + 600))   # 10-minute total budget (Railway builds can take 3-5min)
          ATTEMPT=0
          LIVE_SHA="(none)"
          STATUS=0
          while [ $SECONDS -lt $DEADLINE ]; do
            ATTEMPT=$((ATTEMPT + 1))
            BODY=$(curl -s --max-time 10 https://leasely.net/api/health 2>/dev/null || echo "")
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://leasely.net/api/health || echo "000")
            LIVE_SHA=$(echo "$BODY" | grep -o '"commit":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "Attempt $ATTEMPT (t=${SECONDS}s): HTTP $STATUS, live commit=${LIVE_SHA:-(missing)}"
            if [ "$STATUS" = "200" ] && [ -n "$LIVE_SHA" ] && [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
              echo "✅ Production is serving commit $EXPECTED_SHA (verified after $ATTEMPT attempt(s))"
              exit 0
            fi
            sleep 15
          done
          echo "❌ Production never reported commit $EXPECTED_SHA within 10 minutes."
          echo "   Last HTTP status: $STATUS"
          echo "   Last live commit: ${LIVE_SHA:-(missing)}"
          echo "   This usually means Railway didn't finish deploying — check Railway dashboard."
          exit 1

      - name: Verify security config
        run: |
          RESULT=$(curl -s https://leasely.net/api/health/security)
          echo "$RESULT" | python3 -m json.tool 2>/dev/null || echo "$RESULT"
          STATUS=$(echo "$RESULT" | grep -o '"status":"[^"]*"' | head -1)
          echo "Security status: $STATUS"
