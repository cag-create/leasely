[build]
builder = "nixpacks"
buildCommand = "pnpm install && pnpm build"

[deploy]
# `pnpm start` syncs the Drizzle schema (drizzle-kit push) when DATABASE_URL is
# set, then starts the server. The sync lives in package.json, not here, because
# Railway stops reading railway.toml on 2026-12-01 and falls back to `pnpm start`.
startCommand = "pnpm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

[environments.production]
NODE_ENV = "production"
